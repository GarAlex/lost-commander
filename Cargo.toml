[workspace]
resolver = "2"
# Four crates, one repository, one history.
#
#   core   the engine - filesystem and state, no user interface at all
#   tui    lostc      - ratatui + crossterm
#   egui   lostc-gui  - eframe/egui, the Linux one
#   ffi    the C ABI, for front-ends that are not written in Rust
#
# They are separate crates rather than modules of one so the dependency
# direction is a fact the compiler checks rather than a habit: `egui` depends
# on `core`, and `core` cannot reach back because `egui` is not in its
# dependency list. As one package that was only true while nobody typed
# `crate::gui::` in the engine.
#
# The other half of the reason is build time. The graphical front-end used to
# be a *default* feature of the engine, so a test about zip parsing compiled
# eframe and an OpenGL stack first. `cargo test -p lost-commander-core` now
# builds the engine and nothing else.
#
# They are one repository because they are one program: `cargo test
# --workspace` runs all of it in one command, and the tests that check the two
# front-ends still agree about a colour scheme only compile in one build.
members = ["core", "tui", "egui", "ffi"]

# Everything the crates share, so a version is stated once and cannot drift
# between the front-ends.
[workspace.package]
version = "0.1.0"
homepage = "https://github.com/GarAlex/lost-commander"
edition = "2021"
rust-version = "1.74"
license = "MPL-2.0"
repository = "https://github.com/GarAlex/lost-commander"

[workspace.dependencies]
# The version is not optional: a path dependency without one cannot be
# published, because whoever installs from crates.io has no `core/` directory
# to point at. Bump both together.
lost-commander-core = { path = "core", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6.0.0"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
strip = true
