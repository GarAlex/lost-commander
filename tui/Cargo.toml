[package]
name = "lost-commander-tui"
description = "rcmd - the terminal front-end for lost-commander"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["file-manager", "tui", "norton-commander", "terminal", "ratatui"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "lostc"
path = "src/main.rs"

[dependencies]
lost-commander-core.workspace = true
# The crossterm backend is the portable one: it drives the Windows console
# (ConPTY), macOS and Linux from the same code.
ratatui = "0.30"
crossterm = "0.29"

[dev-dependencies]
tempfile.workspace = true
