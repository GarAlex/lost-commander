[package]
name = "lost-commander-tui"
description = "rcmd - the terminal front-end for lost-commander"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The licence file is copied into each crate rather than referenced at the
# workspace root: cargo packages only what is inside the crate directory, so a
# crate published without it ships under a licence whose text is not in the
# tarball. The duplicates are on purpose - do not tidy them away.
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["file-manager", "tui", "norton-commander", "terminal", "ratatui"]
categories = ["command-line-utilities", "filesystem"]

# A library as well as a binary, so the panels can be drawn into a buffer and
# checked. A binary cannot be imported by a test.
[lib]
name = "lostc"
path = "src/lib.rs"

[[bin]]
name = "lostc"
path = "src/main.rs"

[dependencies]
lost-commander-core.workspace = true
# The crossterm backend is the portable one: it drives the Windows console
# (ConPTY), macOS and Linux from the same code.
ratatui = "0.30"
crossterm = "0.29"

# Only to stop ourselves on Ctrl-Z, which needs a real SIGTSTP. There is no
# portable way to ask for that, and nothing else here needs libc.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
