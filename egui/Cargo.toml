[package]
name = "lost-commander-egui"
description = "rcmd-gui - the graphical front-end for lost-commander"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["file-manager", "gui", "egui", "norton-commander", "xtree"]
categories = ["gui", "filesystem"]

# A library and a binary: the window and its widgets are the library, so the
# tests can drive them without opening one, and `main.rs` is the thin shell
# that reads arguments and hands over.
[lib]
name = "lost_commander_egui"
path = "src/lib.rs"

[[bin]]
name = "lostc-gui"
path = "src/main.rs"

[dependencies]
lost-commander-core.workspace = true
serde.workspace = true
# glow rather than wgpu, and x11 for the Linux desktops this actually runs on.
eframe = { version = "0.32", default-features = false, features = ["glow", "default_fonts", "x11"] }
# Decoding for the image viewer and editor. The engine does the operations;
# this reads and writes the files they operate on.
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico", "tiff"] }
# The custom palette is stored by the engine as an unread table, so reading
# and writing one is this crate's job - see `theme::from_settings`.
toml = "0.9.6"
# The terminal panel draws what the engine's emulator reports, so it names the
# same colour type; the journal stamps a recording with the local time.
vt100 = "0.16.2"
chrono.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The same crate again, with the shell-locating test helpers switched on. A
# dev-dependency, so nothing in a real build turns it on.
lost-commander-core = { workspace = true, features = ["testing"] }
