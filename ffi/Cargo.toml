[package]
name = "lost-commander-ffi"
description = "The C ABI front-ends that are not written in Rust call into"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ffi", "file-manager", "bindings", "c-api"]
categories = ["api-bindings", "filesystem"]

[lib]
name = "lost_commander_ffi"
# cdylib for the DLL a native front-end loads; rlib so the tests below can call
# the same functions that front-end will.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The engine, and nothing that draws. This used to have to say
# `default-features = false` to keep eframe and an OpenGL stack out of a
# library loaded by a front-end that draws its own windows. There is no such
# feature to turn off any more: the graphical front-end is a separate crate
# that this one simply does not depend on.
lost-commander-core.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Only to *write* the fixtures the archive tests read back. The engine reads
# them with its own reader, so a test that made its own bytes by hand would
# only be checking that this file agrees with itself about the zip format.
zip = { version = "2.4", default-features = false, features = ["deflate-flate2", "flate2"] }
dirs.workspace = true
